[pytest]
# Add  to Python's sys.path, the directory that contains the tested script.
# This allows to directly import from files without including this directory. 
# (e.g., from "lib_common" import ... rather than "src.lib_common").
# This test imports from job_spark.py which imports from "lib_common", too.
pythonpath = ./src

# Logging configuration
# Goal: Always display logging.info() messages in the console. 
# Otherwise Pytest would only display them in case of test failure. 
# These settings are applied to all messages including those from called scripts.
log_cli = true
log_cli_level = INFO
log_cli_date_format = %Y/%m/%d %H:%M:%S
log_cli_format = %(asctime)s (%(filename)s): %(message)s